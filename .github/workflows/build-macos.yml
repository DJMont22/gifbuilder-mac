name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_name: apple-silicon
            runs_on: macos-latest
            target_arch: arm64
          - arch_name: intel
            runs_on: macos-15-intel
            target_arch: x86_64

    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show Python and repo files
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          echo "--- repo root ---"
          ls -la
          echo "--- python files ---"
          find . -maxdepth 2 -type f \( -name '*.py' -o -name '*.txt' -o -name '*.png' -o -name '*.icns' \) | sort

      - name: Detect entry script
        shell: bash
        run: |
          if [[ -f gif_builder_studio_mac_ready.py ]]; then
            echo "ENTRY_SCRIPT=gif_builder_studio_mac_ready.py" >> "$GITHUB_ENV"
            echo "Using gif_builder_studio_mac_ready.py"
          elif [[ -f gif_builder_studio.py ]]; then
            echo "ENTRY_SCRIPT=gif_builder_studio.py" >> "$GITHUB_ENV"
            echo "Using gif_builder_studio.py"
          else
            echo "Could not find gif_builder_studio_mac_ready.py or gif_builder_studio.py in repo root"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install Pillow>=10.0.0 numpy>=1.26.0 opencv-python-headless>=4.10.0 pyinstaller>=6.0.0

      - name: Compile-check source
        run: |
          python -m py_compile "$ENTRY_SCRIPT"
          python -m py_compile build_scripts/build_macos.py

      - name: Build app bundle
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          BUNDLE_ID: com.example.gifbuilderstudio
          ENTRY_SCRIPT: ${{ env.ENTRY_SCRIPT }}
        run: |
          python build_scripts/build_macos.py

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "GIF Builder Studio.app" "GIF-Builder-Studio-macos-${{ matrix.arch_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIF-Builder-Studio-macos-${{ matrix.arch_name }}
          path: dist/GIF-Builder-Studio-macos-${{ matrix.arch_name }}.zip
          if-no-files-found: error
