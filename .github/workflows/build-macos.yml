name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_name: apple-silicon
            runs_on: macos-26
            target_arch: arm64
          - arch_name: intel
            runs_on: macos-26-intel
            target_arch: x86_64

    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show Python and repo files
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          ls -la

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            Pillow>=10.0.0 \
            numpy>=1.26.0 \
            opencv-python-headless>=4.10.0 \
            pyinstaller>=6.0.0

      - name: Compile-check source
        run: |
          python -m py_compile gif_builder_studio_mac_ready.py
          python -m py_compile build_scripts/build_macos.py

      - name: Build app bundle
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          BUNDLE_ID: com.example.gifbuilderstudio
        run: |
          python build_scripts/build_macos.py

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "GIF Builder Studio.app" "GIF-Builder-Studio-macos-${{ matrix.arch_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GIF-Builder-Studio-macos-${{ matrix.arch_name }}
          path: dist/GIF-Builder-Studio-macos-${{ matrix.arch_name }}.zip
          if-no-files-found: error
